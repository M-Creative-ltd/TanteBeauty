title: 'Farmer partnerships and sustainable sourcing  '
categoryLabel: 'Farmer Partnerships '
description: >-
  At Tante Beauty, we work closely with smallholder farmers who cultivate
  medicinal and aromatic crops such as moringa, rosemary, aloe-vera, chia seeds
  and ginger. Through long-term sourcing partnerships, we support sustainable
  farming practices, improved market access and stronger agricultural value
  chains. Our collaboration focuses on responsible sourcing, quality improvement
  and traceability from farm to final product, ensuring that farmers benefit
  from more stable livelihoods while contributing to a more sustainable and
  transparent agricultural system.
